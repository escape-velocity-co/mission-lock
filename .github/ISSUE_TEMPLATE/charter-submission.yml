name: Charter submission
description: Suggest a charter to add to the eval corpus.
title: "[Charter Submission]: "
labels: ["charter submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for offering a charter!
        
        Charters that exercise something the corpus doesn't cover yet are the most useful.

        *Remember, documents are public. Submit only what you're comfortable having published.**
  - type: input
    id: document
    attributes:
      label: Document(s)
      description: "Link or upload the document(s)"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What Does It Add?
      description: Anything about this charter the corpus might not cover yet? We'll have a look either way!
  - type: checkboxes
    id: consent
    attributes:
      label: Publication Consent
      options:
        - label: I'm comfortable with this charter being public, both in this issue and in the eval corpus.
          required: true
