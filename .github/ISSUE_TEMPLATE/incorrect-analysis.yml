name: Incorrect Analysis
description: Mission Lock Analyzer reported something unexpected during an analysis.
title: "[Unexpected analysis] "
labels: ["unexpected analysis"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug! If you need real-time help, join us on Discord.
  - type: input
    id: document
    attributes:
      label: Document
      description: "Link or upload the document(s)"
      placeholder: "Example Inc. — https://www.sec.gov/Archives/edgar/data/..."
    validations:
      required: true
  - type: input
    id: item
    attributes:
      label: Rule or Attribute
      description: Which rule or attribute is wrong (name or ID, e.g. M3, A5).
    validations:
      required: true
  - type: textarea
    id: reported
    attributes:
      label: MLA Reporting
      description: "The Result or Answer, plus its Evidence and Location."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Reporting
      description: "What did you expect and why did you expect that?"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version and Environment
      description: MLA version from the report's Appendix, where you ran it and the model/effort.
      placeholder: "v0.2.0, Claude Code, Sonnet/High"
