name: Incorrect Analysis
description: Mission Lock Analyzer reported something unexpected during an analysis.
title: "[Unexpected analysis] "
labels: ["unexpected analysis"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to help! Just a reminder that documents here are public.
  - type: textarea
    id: document
    attributes:
      label: Document(s)
      description: "Link or upload the document(s)"
    validations:
      required: true
  - type: input
    id: item
    attributes:
      label: Rule or Attribute
      description: Which rule or attribute?
    validations:
      required: true
  - type: textarea
    id: reported
    attributes:
      label: MLA Reporting
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Reporting
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version and Environment
      description: MLA version from the report's Appendix, where you ran it and the model/effort.
      placeholder: "v0.2.0, Claude Code, Sonnet/High"
